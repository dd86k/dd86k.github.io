<!DOCTYPE html>
<!-- No GRILL Emoji? Thanks, Unicode Consortium... -->
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>DD Emoji Picker</title>
    <meta name="description" content="dd86k's Portfolio">
    <meta name="keywords" content="dd86k,portfolio,development,programming">
    <link href="index.css" rel="stylesheet">
    <link rel="icon" href="fav.png">
</head>
<body>
    <div id="pop" style="display:none;">
        <p id="pop_high"></p>
        <p id="pop_low"></p>
    </div>
    <noscript>Error: Sorry, you need Javascript enabled for this site.</noscript>
    <div id="messages"></div>
    <div class="main">
        <h1>Emoji 18.0 picker</h1>
        <p>Last updated 2026-09-15, using Google's <a href="https://github.com/googlefonts/emoji-metadata">emoji_18_0_ordering.json (2026-09-10)</a></p>
        <fieldset>
            <legend>Search</legend>
            <input id="input_search" type="text" autofocus oninput="searchName(this.value)" placeholder="Name, Unicode, or Emoji">
            <button onclick="clearAll();">Clear</button>
            <button onclick="showRandom();">Random</button>
            <label>Max results:</label>
            <input type="number" id="search_limit" value="30" min="1" max="99" style="width:3em;text-align:right;padding:.25em" onchange="searchLimitChanged(this);"/>
            <input id="input_group" type="checkbox" onchange="toggleInputGroup();">
            <label for="input_group">Show by group</label>
            <input id="input_alts" type="checkbox" onchange="toggleInputAlts();">
            <label for="input_alts">Show alternates</label>
        </fieldset>
        <fieldset id="groups">
            <legend>Groups</legend>
            <button onclick="showAll(false);">All</button>
            <button onclick="showAll(true);">All by group</button>
        </fieldset>
        <p>Click an Emoji, Name, or Code to copy its value into the clipboard.</p>
        <p><span id="stats_loaded">0</span> emojis available, <span id="stats_results">0</span> result(s)</p>
        <p id="loading" style="display:block;">Loading...</p>
        <div id="results"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
